<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Girlfriend's Day ❤️</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

</head>

<body>

    <!-- Matrix Background -->
    <canvas id="matrix"></canvas>

    <!-- Stars -->
    <div id="stars"></div>

    <!-- Loading Screen -->

    <div id="loader">

        <div class="terminal">

            <p class="line">Initializing Surprise...</p>
            <p class="line">Loading Memories...</p>
            <p class="line">Finding Heart...</p>
            <p class="line">Connecting Souls...</p>
            <p class="line">Done ❤️</p>

        </div>

    </div>

    <!-- Main Content -->

    <main id="mainContent">

        <!-- Intro -->

        <section class="hero">

            <h1 id="mainTitle"></h1>

            <p class="subtitle">

                A little surprise made with lots of love ❤️

            </p>

            <button id="startBtn">

                Open My Heart ❤️

            </button>

        </section>

        <!-- Heart Section -->

        <section id="heartSection">

            <div id="heartContainer">

                <div class="heart">

                </div>

            </div>

            <p class="clickText">

                Click the Heart ❤️

            </p>

        </section>

        <!-- Message -->

        <section id="messageSection">

            <div class="glass">

                <h2>

                    Happy Girlfriend's Day My Love ❤️

                </h2>

                <p id="typewriter"></p>

            </div>

        </section>

        <!-- Footer -->

        <footer>

            <p>

                Forever & Always ❤️

            </p>

        </footer>

    </main>

    <!-- Music -->

    <audio id="bgMusic" loop>

        <source src="perfect.mp3" type="audio/mp3">

    </audio>

    <!-- Scripts -->

    <script src="matrix.js"></script>

    <script src="particles.js"></script>

    <script src="script.js"></script>

</body>

</html>
